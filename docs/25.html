<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <title>reflexion</title>
        <meta name="description" content="logotype nano-exhibit">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name=”robots” content="index, follow">
        <script>
            // in development, load the livereload script 
            if (window.location.hostname === "localhost") {
                var script = document.createElement('script');
                script.src = 'http://localhost:35729/livereload.js';
                document.head.appendChild(script);
            } 
            function addsymbols(svg) {
                const symbols = `  
                    <defs>
                        <symbol id="comp" viewBox="0 0 16 8">
                            <rect x="0" y="0" width="16" height="4"/>
                            <rect x="12" y="0" width="4" height="8"/>
                        </symbol>
                        <symbol id="compa" viewBox="0 0 16 16">
                            <use x="0" y="0" width="16" height="8" href="#comp"/>
                            <use x="0" y="8" width="16" height="8" href="#comp" 
                                 transform="rotate(180, 8, 12 )"/>
                        </symbol>
                        <symbol id="compb" viewBox="0 0 16 16">
                            <use x="0" y="0" width="16" height="16" href="#compa"
                                 transform="translate(8, 0) scale(-1, 1) translate(-8, 0)"/>
                        </symbol>
                    </defs>
                `;
                svg.insertAdjacentHTML("afterbegin", symbols);
            }
            function addgrid(svg, size=10, width=100, height=100) {
                const svgns = "http://www.w3.org/2000/svg";
                let group = document.createElementNS(svgns, "g");
                group.setAttribute("id", "grid");
                            
                for (var i = size; i < width; i = i + size) { 
                    let line = document.createElementNS(svgns, "line");
                    line.setAttribute("x1", i);
                    line.setAttribute("y1", 0);
                    line.setAttribute("x2", i);
                    line.setAttribute("y2", height);
                    group.appendChild(line);
                }

                for (var i = size; i < height; i = i + size) {
                    let line = document.createElementNS(svgns, "line");
                    line.setAttribute("x1", 0);
                    line.setAttribute("y1", i);         
                    line.setAttribute("x2", width);
                    line.setAttribute("y2", i);
                    group.appendChild(line);        
                }            
                svg.appendChild(group);
            } 
        </script>
        <style>
            @font-face {
                font-family: 'Archia';
                src: url('fonts/archia-regular-webfont.woff2') format('woff2'),
                     url('fonts/archia-regular-webfont.woff') format('woff');
            }
            body {
                --background-color: white;
                --color: black;
                margin: 0;
                font-family: 'Archia', sans-serif;
                text-align: center;
            }
            a { text-decoration: none; color: var(--color); }
            a:hover { text-decoration: underline; }

            /* full-screen section, colored, figure resting slightly above center */
            section {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                min-height: 100svh;
                box-sizing: border-box;
                padding-bottom: 10svh;
                background-color: var(--background-color);
                color: var(--color);
            }

            /* colors in oklch, matching the "winter" section of index.html */
            section {
                --bg-l: 0.70; --bg-c: 0.10;     /* background lightness, chroma */
                --delta: 0.24;                  /* foreground lightness distance from background */
                --background-color: oklch(var(--bg-l) var(--bg-c) var(--hue));
                --color: oklch(calc(var(--bg-l) + var(--fg-dir) * var(--delta)) var(--fg-c) var(--fg-hue));
            }

            /* winter thaw: cool steel blue, near-white */
            section#four { --hue: 245; --fg-hue: 245; --fg-c: 0.015; --fg-dir: 1; }

            figure { width: min(400px, 60%); margin: 0; }
            figure svg { display: block; width: 100%; }
            figcaption {
                font-size: 48px;
                padding-top: 2rem;
            }
            rect { fill: var(--color); }
            line {
                stroke: var(--background-color);
                stroke-width: .4;
            }
            /* pinned to the bottom of the section, out of the flex flow so the figure stays put */
            footer { font-size: 24px; position: absolute; bottom: 0; left: 0; right: 0; }
            @media only screen and (max-width: 800px) {
                figcaption { font-size: 36px; }
                footer { font-size: 18px; }
            }
        </style>
    </head>
    <body>
        <main>
            <section id="four">
                <figure>
                    <svg id="2025" viewBox="0 20 36 16" xmlns="http://www.w3.org/2000/svg">
                        <use x="0" y="20" width="16" height="16" href="#compa"/>
                        <use x="20" y="20" width="16" height="16" href="#compb"/>
                    </svg>
                    <figcaption>2025</figcaption>
                </figure>
                <footer>
                    <p class="copyright">&copy; <a href="index.html">jan <span id="cwyear">2025</span></a> <a href="https://github.com/ajsmith607/reflexion">github.com/ajsmith607/reflexion </a></p>
                </footer>
            </section>
        </main>

        <script> 
            document.addEventListener('DOMContentLoaded', () => {
                
                const svg3 = document.getElementById("2025");
                addsymbols(svg3);
                addgrid(svg3, 4, 36, 36);
                
            });
        </script>

    </body>
</html>
